<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>サクラQRコード</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; top: 0; left: 0; overscroll-behavior: none; }
    body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }

    .bg-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .bg-night { background: radial-gradient(circle at 50% 35%, #251224 0%, #0e0712 65%, #030205 100%); opacity: 1; }
    .bg-day { background: radial-gradient(circle at 50% 25%, #d8ecf8 0%, #bdd8ec 45%, #e8cddb 100%); opacity: 0; }
    .bg-cyber { background: radial-gradient(circle at 50% 35%, #0d1b2a 0%, #050811 65%, #010206 100%); opacity: 0; }

    #warp-wave { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; z-index: 15; transform: translate(-50%, -50%) scale(0); opacity: 0; }
    #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; cursor: crosshair; }
    #burst-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 12; pointer-events: none; overflow: hidden; }
    .burst-petal { position: absolute; width: 14px; height: 18px; border-radius: 50% 0 50% 50%; pointer-events: none; transform-origin: center center; filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.6)); }
    #hidden-qrcode { display: none; }

    .fixed-header { position: absolute; top: 1.8rem; left: 1.8rem; right: 1.8rem; display: flex; align-items: center; justify-content: space-between; z-index: 20; pointer-events: none; }
    .brand-title { font-size: 1.35rem; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #ffb3d9 0%, #ff69b4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255, 105, 180, 0.3); pointer-events: auto; transition: all 0.4s ease; }
    body.theme-cyber .brand-title { background: linear-gradient(135deg, #00f0ff 0%, #ff007f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }
    body.theme-day .brand-title { background: linear-gradient(135deg, #d81b60 0%, #304ffe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 2px 10px rgba(216, 27, 96, 0.2); }

    .open-panel-btn { pointer-events: auto; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 0.55rem 1.1rem; border-radius: 30px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.3); opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0.35s ease, background 0.2s, border-color 0.2s, color 0.3s; }
    body.theme-day .open-panel-btn { color: #1e3a5f; background: rgba(255, 255, 255, 0.75); border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 8px 20px rgba(30, 58, 95, 0.12); }
    .open-panel-btn.visible { opacity: 1; visibility: visible; }

    .ui-bottom-layer { position: absolute; bottom: 1.8rem; left: 1.8rem; right: 1.8rem; z-index: 20; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
    
    .control-panel { 
      pointer-events: auto; 
      max-width: 480px; 
      width: 100%; 
      background: rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(28px); 
      -webkit-backdrop-filter: blur(28px); 
      border: 1px solid rgba(255, 255, 255, 0.16); 
      border-radius: 24px; 
      padding: 1.4rem; 
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 1px 1px rgba(255, 255, 255, 0.2); 
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, background 0.3s, border-color 0.3s; 
      transform: translateY(0); 
      opacity: 1; 
    }
    body.theme-day .control-panel { background: rgba(255, 255, 255, 0.8); border-color: rgba(255, 255, 255, 0.95); box-shadow: 0 20px 50px rgba(30, 58, 95, 0.15); color: #222; }
    .control-panel.hidden { transform: translateY(140%); opacity: 0; pointer-events: none; }

    .input-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
    .input-wrapper { position: relative; flex: 1; }
    .input-field { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px; padding: 0.85rem 4rem 0.85rem 1.1rem; font-size: 0.92rem; color: #fff; outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s; }
    .input-field::placeholder { color: rgba(255, 255, 255, 0.35); letter-spacing: 0.5px; }
    body.theme-day .input-field { background: rgba(255, 255, 255, 0.95); border-color: rgba(30, 58, 95, 0.2); color: #1e3a5f; }
    body.theme-day .input-field::placeholder { color: rgba(30, 58, 95, 0.38); }
    .input-field:focus { border-color: #ff77a9; box-shadow: 0 0 15px rgba(255, 119, 169, 0.35); }
    body.theme-cyber .input-field:focus { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

    .live-badge { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.65rem; font-weight: 700; color: #ff77a9; background: rgba(255, 119, 169, 0.15); padding: 0.2rem 0.45rem; border-radius: 6px; pointer-events: none; transition: all 0.3s ease; }
    body.theme-cyber .live-badge { color: #00f0ff; background: rgba(0, 240, 255, 0.15); }
    .live-badge.scanning { background: #ff69b4; color: #fff; box-shadow: 0 0 12px #ff69b4; transform: translateY(-50%) scale(1.08); }

    .done-btn { background: linear-gradient(135deg, #ff69b4 0%, #e02874 100%); color: #fff; border: none; border-radius: 14px; padding: 0 1.2rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, box-shadow 0.2s; white-space: nowrap; }
    body.theme-cyber .done-btn { background: linear-gradient(135deg, #00f0ff 0%, #7928ca 100%); }
    .done-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(224, 40, 116, 0.4); }

    /* 下載展開開關列 */
    .download-toggle-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.8rem;
    }
    .toggle-drawer-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    body.theme-day .toggle-drawer-btn { color: #1e3a5f; }
    .toggle-drawer-btn:hover { color: #ff77a9; background: rgba(255, 255, 255, 0.08); }

    /* 摺疊式下載抽屜（Collapsible Export Drawer） */
    .export-drawer {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin-bottom 0.3s ease;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      padding: 0 1rem;
      border: 1px solid transparent;
      margin-bottom: 0;
    }
    body.theme-day .export-drawer { background: rgba(0, 0, 0, 0.05); }

    .export-drawer.open {
      max-height: 140px;
      opacity: 1;
      padding: 0.85rem 1rem;
      border-color: rgba(255, 255, 255, 0.08);
      margin-bottom: 0.9rem;
    }

    .export-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.7rem;
    }

    .color-picker-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.8);
    }
    body.theme-day .color-picker-group { color: #333; }

    .color-input {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 50%;
    }
    .color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-input::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.8);
    }
    body.theme-day .checkbox-group { color: #333; }
    .checkbox-group input { cursor: pointer; accent-color: #ff69b4; }

    .export-btn {
      width: 100%;
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.55rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .export-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0, 240, 255, 0.35); }

    .theme-selector-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.9rem; }
    .theme-btn { flex: 1; padding: 0.45rem 0.6rem; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; background: rgba(0, 0, 0, 0.25); color: #bbb; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.35rem; transition: all 0.25s ease; }
    body.theme-day .theme-btn { background: rgba(255, 255, 255, 0.9); border-color: rgba(30, 58, 95, 0.15); color: #555; }
    .theme-btn.active { background: rgba(255, 255, 255, 0.22); border-color: #ff77a9; color: #fff; box-shadow: 0 4px 12px rgba(255, 119, 169, 0.25); }
    body.theme-cyber .theme-btn.active { border-color: #00f0ff; box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3); }
    body.theme-day .theme-btn.active { background: #d81b60; border-color: #d81b60; color: #fff; }

    .switch-container { display: flex; background: rgba(0, 0, 0, 0.35); border-radius: 14px; padding: 0.3rem; border: 1px solid rgba(255, 255, 255, 0.08); }
    body.theme-day .switch-container { background: rgba(0, 0, 0, 0.06); border-color: rgba(0, 0, 0, 0.05); }
    .mode-btn { flex: 1; padding: 0.6rem; border: none; border-radius: 10px; background: transparent; color: #aaa; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    body.theme-day .mode-btn { color: #555; }
    .mode-btn.active { background: rgba(255, 255, 255, 0.18); color: #fff; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25); }
    body.theme-day .mode-btn.active { background: #fff; color: #d81b60; box-shadow: 0 4px 15px rgba(216, 27, 96, 0.15); }

    .floating-mode-switch { position: absolute; bottom: 0; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 30px; padding: 0.3rem; display: flex; pointer-events: none; opacity: 0; transform: translateY(30px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    body.theme-day .floating-mode-switch { background: rgba(255, 255, 255, 0.85); border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 10px 30px rgba(30, 58, 95, 0.15); }
    .floating-mode-switch.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .floating-mode-switch button { padding: 0.5rem 1.1rem; border: none; border-radius: 20px; background: transparent; color: #ddd; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    body.theme-day .floating-mode-switch button { color: #555; }
    .floating-mode-switch button.active { background: linear-gradient(135deg, #ff77a9 0%, #e02874 100%); color: #fff; }
    body.theme-cyber .floating-mode-switch button.active { background: linear-gradient(135deg, #00f0ff 0%, #7928ca 100%); }

    .hint-toast { position: absolute; top: 5.5rem; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 0.35rem 0.9rem; font-size: 0.75rem; color: rgba(255, 255, 255, 0.85); pointer-events: none; opacity: 1; transition: opacity 0.5s ease; z-index: 5; }
    body.theme-day .hint-toast { background: rgba(255, 255, 255, 0.85); color: #1e3a5f; border-color: rgba(30, 58, 95, 0.15); }

    @media (max-width: 600px) {
      .fixed-header { top: 1.2rem; left: 1.2rem; right: 1.2rem; }
      .ui-bottom-layer { bottom: 1.2rem; left: 1.2rem; right: 1.2rem; }
      .brand-title { font-size: 1.15rem; }
      .control-panel { padding: 1.1rem; }
    }
  </style>
</head>
<body class="theme-night">

  <div id="bg-night" class="bg-layer bg-night"></div>
  <div id="bg-day" class="bg-layer bg-day"></div>
  <div id="bg-cyber" class="bg-layer bg-cyber"></div>
  <div id="warp-wave"></div>

  <canvas id="webgl-canvas"></canvas>

  <div id="burst-container"></div>
  <div id="hidden-qrcode"></div>

  <div id="hint-toast" class="hint-toast">🌸 點擊畫面任意處觸發落櫻爆發</div>

  <header class="fixed-header">
    <div class="brand-title">サクラQRコード</div>
    <button id="open-panel-btn" class="open-panel-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      編輯網址
    </button>
  </header>

  <div class="ui-bottom-layer">
    <div id="floating-mode-switch" class="floating-mode-switch">
      <button id="float-btn-2d" class="active">2D 平面碼</button>
      <button id="float-btn-3d">3D 櫻花樹</button>
    </div>

    <div id="control-panel" class="control-panel">
      <div class="input-row">
        <div class="input-wrapper">
          <input type="text" id="url-input" class="input-field" placeholder="www.owlson109.com">
          <span id="live-badge" class="live-badge">LIVE</span>
        </div>
        <button id="done-btn" class="done-btn">隱藏輸入框</button>
      </div>

      <!-- 下載抽屜展開開關列 -->
      <div class="download-toggle-bar">
        <button id="toggle-drawer-btn" class="toggle-drawer-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          自訂下載 PNG
        </button>
      </div>

      <!-- 摺疊式自訂下載設定抽屜 -->
      <div id="export-drawer" class="export-drawer">
        <div class="export-controls-row">
          <div class="color-picker-group">
            <span>碼色</span>
            <input type="color" id="qr-color-picker" class="color-input" value="#000000">
          </div>
          <div class="color-picker-group">
            <span>底色</span>
            <input type="color" id="bg-color-picker" class="color-input" value="#ffffff">
          </div>
          <label class="checkbox-group">
            <input type="checkbox" id="transparent-bg-checkbox">
            <span>透明底</span>
          </label>
        </div>
        <button id="export-png-btn" class="export-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          立即匯出高畫質 PNG
        </button>
      </div>

      <div class="theme-selector-row">
        <button class="theme-btn active" data-theme="night">🌙 夜櫻</button>
        <button class="theme-btn" data-theme="day">☀️ 春晝</button>
        <button class="theme-btn" data-theme="cyber">⚡ 賽博</button>
      </div>

      <div class="switch-container">
        <button id="btn-2d" class="mode-btn active">俯視 2D 平面碼</button>
        <button id="btn-3d" class="mode-btn">側視 3D 櫻花樹</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_URL = "www.owlson109.com";

    const canvas = document.getElementById('webgl-canvas');
    const urlInput = document.getElementById('url-input');
    const doneBtn = document.getElementById('done-btn');
    const openPanelBtn = document.getElementById('open-panel-btn');
    const controlPanel = document.getElementById('control-panel');
    const floatingSwitch = document.getElementById('floating-mode-switch');
    const burstContainer = document.getElementById('burst-container');
    const warpWave = document.getElementById('warp-wave');
    const liveBadge = document.getElementById('live-badge');
    
    // 下載抽屜相關元件
    const toggleDrawerBtn = document.getElementById('toggle-drawer-btn');
    const exportDrawer = document.getElementById('export-drawer');
    const qrColorPicker = document.getElementById('qr-color-picker');
    const bgColorPicker = document.getElementById('bg-color-picker');
    const transparentBgCheckbox = document.getElementById('transparent-bg-checkbox');
    const exportPngBtn = document.getElementById('export-png-btn');

    const btn2D = document.getElementById('btn-2d');
    const btn3D = document.getElementById('btn-3d');
    const floatBtn2D = document.getElementById('float-btn-2d');
    const floatBtn3D = document.getElementById('float-btn-3d');
    const themeBtns = document.querySelectorAll('.theme-btn');
    const hiddenQR = document.getElementById('hidden-qrcode');

    let scene, camera, renderer, controls;
    let qrParticleGeo, qrParticleMat, qrParticleSystem;
    let sparkleGeo, sparkleMat, sparkleSystem;

    let currentMode = '2D';
    let currentTheme = 'night';

    const MAX_QR_PARTICLES = 14000;
    const SPARKLE_COUNT = 240;
    let QR_PARTICLES_COUNT = 0;
    
    let pos2D = new Float32Array(MAX_QR_PARTICLES * 3);
    let pos3D = new Float32Array(MAX_QR_PARTICLES * 3);
    let color2D = new Float32Array(MAX_QR_PARTICLES * 3);
    let color3D = new Float32Array(MAX_QR_PARTICLES * 3);
    let growthDelays = new Float32Array(MAX_QR_PARTICLES);

    let sparkleData = [];
    let fallingPetals;
    let debounceTimer = null;
    let isTransitioning = false;
    let isLiveWaveMorphing = false;
    
    let transitionBlend = { value: 0 };

    const THEMES = {
      night: {
        fog: 0x0a060d, qrSolid: new THREE.Color(0xffffff), sparkle: new THREE.Color(0xffb7c5),
        barkDark: new THREE.Color(0x28120d), barkLight: new THREE.Color(0x4a2418),
        flowerCore: new THREE.Color(0xd81159), flowerDeep: new THREE.Color(0xff2a85), flowerMid: new THREE.Color(0xff77a9), flowerLight: new THREE.Color(0xffd1dc), flowerTip: new THREE.Color(0xfff8fa),
        petalFall: 0xff8ebb, domPetals: ['#fff8fa', '#ffd1dc', '#ff77a9', '#ff2a85', '#d81159'], waveColor: 'rgba(255, 105, 180, 0.8)'
      },
      day: {
        fog: 0xbed8ec, qrSolid: new THREE.Color(0xd81b60), sparkle: new THREE.Color(0xff69b4),
        barkDark: new THREE.Color(0x3d1c14), barkLight: new THREE.Color(0x613524),
        flowerCore: new THREE.Color(0xb7094c), flowerDeep: new THREE.Color(0xe01e69), flowerMid: new THREE.Color(0xff6392), flowerLight: new THREE.Color(0xffadc9), flowerTip: new THREE.Color(0xffffff),
        petalFall: 0xff529a, domPetals: ['#ffffff', '#ffadc9', '#ff6392', '#e01e69', '#b7094c'], waveColor: 'rgba(216, 27, 96, 0.8)'
      },
      cyber: {
        fog: 0x04060f, qrSolid: new THREE.Color(0x00f0ff), sparkle: new THREE.Color(0xff007f),
        barkDark: new THREE.Color(0x0a0f1d), barkLight: new THREE.Color(0x182238),
        flowerCore: new THREE.Color(0x7209b7), flowerDeep: new THREE.Color(0xb5179e), flowerMid: new THREE.Color(0xf72585), flowerLight: new THREE.Color(0x4cc9f0), flowerTip: new THREE.Color(0x00f0ff),
        petalFall: 0x00f0ff, domPetals: ['#00f0ff', '#4cc9f0', '#f72585', '#b5179e', '#7209b7'], waveColor: 'rgba(0, 240, 255, 0.9)'
      }
    };

    function isMobileDevice() {
      return window.innerWidth <= 600;
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(THEMES[currentTheme].fog, 0.005);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      const mobileScale = isMobileDevice() ? 0.8 : 1.0;
      camera.position.set(36, 18, 46);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxDistance = 180;
      controls.minDistance = 15;
      controls.target.set(0, 7.5 * mobileScale, 0);

      const texture = createEnhancedParticleTexture();

      qrParticleGeo = new THREE.BufferGeometry();
      qrParticleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_QR_PARTICLES * 3), 3));
      qrParticleGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAX_QR_PARTICLES * 3), 3));

      qrParticleMat = new THREE.PointsMaterial({
        size: isMobileDevice() ? 1.05 : 1.18,
        vertexColors: true, map: texture, transparent: true, opacity: 0.96, blending: THREE.AdditiveBlending, depthWrite: false
      });

      qrParticleSystem = new THREE.Points(qrParticleGeo, qrParticleMat);
      scene.add(qrParticleSystem);

      initIndependentSparkles(texture);
      initSparsePetals(texture);

      window.addEventListener('resize', onWindowResize);
      initGlobalPetalBurst();

      animate();
    }

    function initIndependentSparkles(texture) {
      sparkleGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(SPARKLE_COUNT * 3);
      const cols = new Float32Array(SPARKLE_COUNT * 3);
      sparkleData = [];

      const col = THEMES[currentTheme].sparkle;
      const radScale = isMobileDevice() ? 0.8 : 1.0;

      for (let i = 0; i < SPARKLE_COUNT; i++) {
        const baseAng = Math.random() * Math.PI * 2;
        const baseRad = (15 + Math.random() * 9) * radScale;
        
        pos[i * 3] = Math.cos(baseAng) * baseRad;
        pos[i * 3 + 1] = 0;
        pos[i * 3 + 2] = Math.sin(baseAng) * baseRad;

        cols[i * 3] = col.r; cols[i * 3 + 1] = col.g; cols[i * 3 + 2] = col.b;

        sparkleData.push({
          baseAngle: baseAng, radius: baseRad,
          speed: 0.18 + Math.random() * 0.25, floatFreq: 1.5 + Math.random() * 2, floatAmp: 0.4 + Math.random() * 0.5,
          height3D: ((Math.random() - 0.5) * 16 + 6) * radScale, seed: Math.random() * 10
        });
      }

      sparkleGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      sparkleGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));

      sparkleMat = new THREE.PointsMaterial({
        size: isMobileDevice() ? 1.0 : 1.15,
        vertexColors: true, map: texture, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false
      });

      sparkleSystem = new THREE.Points(sparkleGeo, sparkleMat);
      scene.add(sparkleSystem);
    }

    function createEnhancedParticleTexture() {
      const c = document.createElement('canvas'); c.width = 64; c.height = 64; const ctx = c.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); gradient.addColorStop(0.2, 'rgba(255, 240, 248, 0.95)');
      gradient.addColorStop(0.5, 'rgba(255, 140, 190, 0.5)'); gradient.addColorStop(0.8, 'rgba(255, 80, 150, 0.15)'); gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    function initSparsePetals(texture) {
      const count = 70;
      const geom = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const velocities = [];

      for (let i = 0; i < count; i++) {
        const rad = 28 + Math.random() * 40;
        const ang = Math.random() * Math.PI * 2;
        pos[i * 3] = Math.cos(ang) * rad; pos[i * 3 + 1] = Math.random() * 80 - 20; pos[i * 3 + 2] = Math.sin(ang) * rad;
        velocities.push({ x: (Math.random() - 0.5) * 0.04 + 0.02, y: -(Math.random() * 0.05 + 0.02), z: (Math.random() - 0.5) * 0.04 });
      }

      geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ size: 1.25, map: texture, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, color: THEMES[currentTheme].petalFall });

      fallingPetals = new THREE.Points(geom, mat);
      fallingPetals.userData.velocities = velocities;
      scene.add(fallingPetals);
    }

    function initGlobalPetalBurst() {
      let pointerDownX = 0, pointerDownY = 0;
      window.addEventListener('pointerdown', (e) => { pointerDownX = e.clientX; pointerDownY = e.clientY; });
      window.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY) > 12) return;
        if (e.target.closest('.control-panel') || e.target.closest('.fixed-header') || e.target.closest('.floating-mode-switch')) return;
        createExplosionAt(e.clientX, e.clientY);
      });
    }

    function createExplosionAt(x, y) {
      const colors = THEMES[currentTheme].domPetals;
      if (currentMode === '3D' && qrParticleSystem) {
        gsap.fromTo(qrParticleSystem.position, { y: 0.8 }, { y: 0, duration: 0.7, ease: "elastic.out(1.2, 0.4)" });
      }

      for (let i = 0; i < 35; i++) {
        const petal = document.createElement('div');
        petal.className = 'burst-petal';
        petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        petal.style.left = `${x}px`; petal.style.top = `${y}px`;
        burstContainer.appendChild(petal);

        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 180;
        const targetX = Math.cos(angle) * distance;
        const targetY = Math.sin(angle) * distance - (40 + Math.random() * 60);
        const finalDropY = targetY + (120 + Math.random() * 200);
        const rotationZ = (Math.random() - 0.5) * 720;
        const rotationY = Math.random() * 360;
        const scale = 0.5 + Math.random() * 0.7;
        const duration = 1.2 + Math.random() * 0.8;

        const tl = gsap.timeline({ onComplete: () => petal.remove() });
        tl.to(petal, { x: targetX, y: targetY, rotationZ: rotationZ * 0.4, rotationY: rotationY, scale: scale, duration: duration * 0.35, ease: "power2.out" })
          .to(petal, { x: targetX + (Math.random() - 0.5) * 60, y: finalDropY, rotationZ: rotationZ, opacity: 0, duration: duration * 0.65, ease: "power1.in" });
      }
    }

    function generateQRAndModel(text, isLiveInput = false, onBuiltCallback = null) {
      const content = text.trim() || DEFAULT_URL;
      hiddenQR.innerHTML = "";
      new QRCode(hiddenQR, { text: content, width: 128, height: 128, correctLevel: QRCode.CorrectLevel.M });

      setTimeout(() => {
        const qrCanvas = hiddenQR.querySelector('canvas');
        if (!qrCanvas) return;
        const ctx = qrCanvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
        const data = imgData.data;
        const darkPixels = [];

        const scaleFactor = isMobileDevice() ? 0.196 : 0.245;

        for (let y = 0; y < qrCanvas.height; y++) {
          for (let x = 0; x < qrCanvas.width; x++) {
            if (data[(y * qrCanvas.width + x) * 4] < 128) {
              darkPixels.push({ x: (x - qrCanvas.width / 2) * scaleFactor, z: (y - qrCanvas.height / 2) * scaleFactor });
            }
          }
        }

        buildQRTreeModel(darkPixels);

        if (onBuiltCallback) {
          onBuiltCallback();
        } else if (isLiveInput) {
          playOnlyQRWaveTransition();
        } else {
          updateQRDirect();
        }
      }, 40);
    }

    function buildQRTreeModel(darkPixels) {
      QR_PARTICLES_COUNT = darkPixels.length;
      const theme = THEMES[currentTheme];
      const mobileScale = isMobileDevice() ? 0.8 : 1.0;

      const branchCenters = [
        { x: -8 * mobileScale, y: 13 * mobileScale, z: -7 * mobileScale },
        { x: 9 * mobileScale, y: 14 * mobileScale, z: -5 * mobileScale },
        { x: -6 * mobileScale, y: 15 * mobileScale, z: 8 * mobileScale },
        { x: 7 * mobileScale, y: 16 * mobileScale, z: 7 * mobileScale },
        { x: 0, y: 20 * mobileScale, z: 0 }
      ];

      for (let i = 0; i < MAX_QR_PARTICLES; i++) {
        if (i < QR_PARTICLES_COUNT) {
          let x2D = darkPixels[i].x; let y2D = 0; let z2D = darkPixels[i].z;
          let x3D, y3D, z3D;
          let c2D = theme.qrSolid;
          let c3D = new THREE.Color();
          let delayOffset = 0;

          const ratio = i / QR_PARTICLES_COUNT;
          if (ratio < 0.18) {
            const t = ratio / 0.18;
            y3D = (t * 14 - 10) * mobileScale;
            const trunkWidth = (1 - t * 0.55) * 2.0 * mobileScale + 0.3;
            const theta = Math.random() * Math.PI * 2;
            x3D = Math.cos(theta) * trunkWidth + Math.sin(t * 3) * (1.0 * mobileScale);
            z3D = Math.sin(theta) * trunkWidth + Math.cos(t * 2) * (0.9 * mobileScale);
            c3D.lerpColors(theme.barkDark, theme.barkLight, Math.random() * 0.8);
            delayOffset = t * 0.25;
          } else if (ratio < 0.36) {
            const target = branchCenters[Math.floor(Math.random() * branchCenters.length)];
            const t = Math.random();
            x3D = THREE.MathUtils.lerp(0, target.x, t) + (Math.random() - 0.5) * (1.3 * mobileScale);
            y3D = THREE.MathUtils.lerp(4 * mobileScale, target.y, t) + (Math.random() - 0.5) * (1.0 * mobileScale);
            z3D = THREE.MathUtils.lerp(0, target.z, t) + (Math.random() - 0.5) * (1.3 * mobileScale);
            c3D = Math.random() > 0.4 ? theme.barkLight : theme.flowerCore;
            delayOffset = 0.25 + t * 0.3;
          } else {
            const center = branchCenters[Math.floor(Math.random() * branchCenters.length)];
            const theta = Math.random() * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * Math.random() - 1.0);
            const r = Math.cbrt(Math.random()) * (8.5 * mobileScale);

            x3D = center.x + r * Math.sin(phi) * Math.cos(theta);
            y3D = center.y + (r * Math.sin(phi) * Math.sin(theta)) * 0.75;
            z3D = center.z + r * Math.cos(phi);

            const depthFactor = Math.cbrt(Math.random()) + (Math.random() - 0.5) * 0.25;
            if (depthFactor < 0.25) c3D.lerpColors(theme.flowerCore, theme.flowerDeep, depthFactor / 0.25);
            else if (depthFactor < 0.55) c3D.lerpColors(theme.flowerDeep, theme.flowerMid, (depthFactor - 0.25) / 0.3);
            else if (depthFactor < 0.82) c3D.lerpColors(theme.flowerMid, theme.flowerLight, (depthFactor - 0.55) / 0.27);
            else c3D.lerpColors(theme.flowerLight, theme.flowerTip, (depthFactor - 0.82) / 0.18);

            if (y3D > 18 * mobileScale) c3D.lerp(theme.flowerTip, 0.25);
            delayOffset = 0.45 + Math.random() * 0.4;
          }

          pos2D[i * 3] = x2D; pos2D[i * 3 + 1] = y2D; pos2D[i * 3 + 2] = z2D;
          pos3D[i * 3] = x3D; pos3D[i * 3 + 1] = y3D; pos3D[i * 3 + 2] = z3D;
          color2D[i * 3] = c2D.r; color2D[i * 3 + 1] = c2D.g; color2D[i * 3 + 2] = c2D.b;
          color3D[i * 3] = c3D.r; color3D[i * 3 + 1] = c3D.g; color3D[i * 3 + 2] = c3D.b;
          growthDelays[i] = delayOffset;
        } else {
          pos2D[i * 3] = 0; pos2D[i * 3 + 1] = -9999; pos2D[i * 3 + 2] = 0;
          pos3D[i * 3] = 0; pos3D[i * 3 + 1] = -9999; pos3D[i * 3 + 2] = 0;
        }
      }
    }

    function updateQRDirect() {
      const targetPos = (currentMode === '2D') ? pos2D : pos3D;
      const targetCol = (currentMode === '2D') ? color2D : color3D;
      const pArr = qrParticleGeo.attributes.position.array;
      const cArr = qrParticleGeo.attributes.color.array;

      for (let i = 0; i < MAX_QR_PARTICLES * 3; i++) {
        pArr[i] = targetPos[i]; cArr[i] = targetCol[i];
      }
      qrParticleGeo.attributes.position.needsUpdate = true;
      qrParticleGeo.attributes.color.needsUpdate = true;
    }

    function playOnlyQRWaveTransition() {
      if (isLiveWaveMorphing) return;
      isLiveWaveMorphing = true;
      liveBadge.classList.add('scanning');

      const targetPos = (currentMode === '2D') ? pos2D : pos3D;
      const targetCol = (currentMode === '2D') ? color2D : color3D;
      const positions = qrParticleGeo.attributes.position.array;
      const colAttr = qrParticleGeo.attributes.color.array;

      const startPos = new Float32Array(positions);
      const startCol = new Float32Array(colAttr);
      const waveAnim = { progress: 0 };

      gsap.to(waveAnim, {
        progress: 1, duration: 0.85, ease: "power2.inOut",
        onUpdate: () => {
          const globalP = waveAnim.progress;
          for (let i = 0; i < MAX_QR_PARTICLES; i++) {
            const idx = i * 3;
            const normalizedX = THREE.MathUtils.clamp((targetPos[idx] + 22) / 44, 0, 1);
            const smoothT = THREE.MathUtils.smoothstep(THREE.MathUtils.clamp((globalP - normalizedX * 0.35) / 0.65, 0, 1), 0, 1);
            const rippleY = Math.sin(smoothT * Math.PI) * (currentMode === '2D' ? 0.7 : 0.3);

            positions[idx] = startPos[idx] + (targetPos[idx] - startPos[idx]) * smoothT;
            positions[idx + 1] = startPos[idx + 1] + (targetPos[idx + 1] - startPos[idx + 1]) * smoothT + rippleY;
            positions[idx + 2] = startPos[idx + 2] + (targetPos[idx + 2] - startPos[idx + 2]) * smoothT;

            colAttr[idx] = startCol[idx] + (targetCol[idx] - startCol[idx]) * smoothT;
            colAttr[idx + 1] = startCol[idx + 1] + (targetCol[idx + 1] - startCol[idx + 1]) * smoothT;
            colAttr[idx + 2] = startCol[idx + 2] + (targetCol[idx + 2] - startCol[idx + 2]) * smoothT;
          }
          qrParticleGeo.attributes.position.needsUpdate = true;
          qrParticleGeo.attributes.color.needsUpdate = true;
        },
        onComplete: () => { isLiveWaveMorphing = false; liveBadge.classList.remove('scanning'); }
      });
    }

    function switchTheme(themeName) {
      if (currentTheme === themeName) return;
      const prevTheme = currentTheme;
      currentTheme = themeName;

      document.body.className = `theme-${themeName}`;
      themeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.theme === themeName));

      document.getElementById(`bg-${prevTheme}`).style.opacity = '0';
      document.getElementById(`bg-${themeName}`).style.opacity = '1';

      const waveColor = THEMES[themeName].waveColor;
      warpWave.style.boxShadow = `0 0 80px 40px ${waveColor}, inset 0 0 50px ${waveColor}`;
      warpWave.style.border = `2px solid ${waveColor}`;
      gsap.fromTo(warpWave, { scale: 0, opacity: 0.9 }, { scale: 250, opacity: 0, duration: 1.1, ease: "power2.out" });

      gsap.to(scene.fog.color, { r: ((THEMES[themeName].fog >> 16) & 255) / 255, g: ((THEMES[themeName].fog >> 8) & 255) / 255, b: (THEMES[themeName].fog & 255) / 255, duration: 0.9 });

      if (sparkleGeo) {
        const sCols = sparkleGeo.attributes.color.array;
        const newCol = THEMES[themeName].sparkle;
        for (let i = 0; i < SPARKLE_COUNT; i++) { sCols[i * 3] = newCol.r; sCols[i * 3 + 1] = newCol.g; sCols[i * 3 + 2] = newCol.b; }
        sparkleGeo.attributes.color.needsUpdate = true;
      }
      generateQRAndModel(urlInput.value, true);
    }

    themeBtns.forEach(btn => btn.addEventListener('click', () => switchTheme(btn.dataset.theme)));

    function transitionTo(mode) {
      if (currentMode === mode || isTransitioning) return;
      currentMode = mode;
      isTransitioning = true;

      const targetPos = (mode === '2D') ? pos2D : pos3D;
      const targetCol = (mode === '2D') ? color2D : color3D;

      const positions = qrParticleGeo.attributes.position.array;
      const colAttr = qrParticleGeo.attributes.color.array;
      const startPos = new Float32Array(positions);
      const startCol = new Float32Array(colAttr);

      gsap.to(transitionBlend, {
        value: mode === '3D' ? 1 : 0,
        duration: 2.5,
        ease: "power2.out"
      });

      const mobileScale = isMobileDevice() ? 0.8 : 1.0;
      const targetCenterY = (mode === '3D') ? 7.5 * mobileScale : 0;

      const initialTargetX = controls.target.x;
      const initialTargetZ = controls.target.z;

      const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
      const spherical = new THREE.Spherical().setFromVector3(offset);

      const targetPhi = (mode === '2D') ? 0.001 : 1.1; 
      const currentTheta = spherical.theta || 0.6;

      const animCam = {
        radius: spherical.radius,
        phi: spherical.phi,
        theta: currentTheta,
        targetY: controls.target.y,
        targetX: initialTargetX,
        targetZ: initialTargetZ
      };

      if (mode === '2D') {
        btn2D.classList.add('active'); btn3D.classList.remove('active');
        floatBtn2D.classList.add('active'); floatBtn3D.classList.remove('active');
      } else {
        btn3D.classList.add('active'); btn2D.classList.remove('active');
        floatBtn3D.classList.add('active'); floatBtn2D.classList.remove('active');
      }

      gsap.to(animCam, {
        phi: targetPhi,
        targetY: targetCenterY,
        targetX: 0,
        targetZ: 0,
        duration: 2.5,
        ease: "power2.out",
        onUpdate: () => {
          controls.target.set(animCam.targetX, animCam.targetY, animCam.targetZ);
          const newOffset = new THREE.Vector3().setFromSpherical(new THREE.Spherical(animCam.radius, animCam.phi, animCam.theta));
          camera.position.copy(controls.target).add(newOffset);
          controls.update();
        }
      });

      const tweenObj = { progress: 0 };
      gsap.to(tweenObj, {
        progress: 1, duration: 2.5, ease: "power2.out",
        onUpdate: () => {
          const globalProgress = tweenObj.progress;
          for (let i = 0; i < MAX_QR_PARTICLES; i++) {
            const idx = i * 3;
            const easedP = THREE.MathUtils.smoothstep(
              mode === '3D' ? THREE.MathUtils.clamp((globalProgress - growthDelays[i] * 0.45) / 0.55, 0, 1) : globalProgress, 0, 1
            );

            positions[idx] = startPos[idx] + (targetPos[idx] - startPos[idx]) * easedP;
            positions[idx + 1] = startPos[idx + 1] + (targetPos[idx + 1] - startPos[idx + 1]) * easedP;
            positions[idx + 2] = startPos[idx + 2] + (targetPos[idx + 2] - startPos[idx + 2]) * easedP;

            colAttr[idx] = startCol[idx] + (targetCol[idx] - startCol[idx]) * easedP;
            colAttr[idx + 1] = startCol[idx + 1] + (targetCol[idx + 1] - startCol[idx + 1]) * easedP;
            colAttr[idx + 2] = startCol[idx + 2] + (targetCol[idx + 2] - startCol[idx + 2]) * easedP;
          }
          qrParticleGeo.attributes.position.needsUpdate = true;
          qrParticleGeo.attributes.color.needsUpdate = true;
        },
        onComplete: () => { isTransitioning = false; }
      });
    }

    function hideControlPanel() {
      urlInput.blur();
      controlPanel.classList.add('hidden');
      openPanelBtn.classList.add('visible');
      floatingSwitch.classList.add('visible');
      exportDrawer.classList.remove('open'); // 收起面板時自動收合下載抽屜
    }

    function showControlPanel() {
      controlPanel.classList.remove('hidden');
      openPanelBtn.classList.remove('visible');
      floatingSwitch.classList.remove('visible');
      setTimeout(() => { urlInput.focus({ preventScroll: true }); }, 350);
    }

    // --- 🌟 下載抽屜展開/收合事件 ---
    toggleDrawerBtn.addEventListener('click', () => {
      exportDrawer.classList.toggle('open');
    });

    // 透明底勾選框聯動底色選取器
    transparentBgCheckbox.addEventListener('change', (e) => {
      bgColorPicker.disabled = e.target.checked;
      bgColorPicker.style.opacity = e.target.checked ? "0.3" : "1";
    });

    // --- 🌟 高解析度自訂 PNG 匯出函數 ---
    function downloadQRCodePNG() {
      const content = urlInput.value.trim() || DEFAULT_URL;
      const isTransparent = transparentBgCheckbox.checked;
      const qrColor = qrColorPicker.value;
      const bgColor = isTransparent ? "transparent" : bgColorPicker.value;

      // 建立高解析度離屏 (Off-screen) 二維碼容器 (1024x1024 超清匯出)
      const exportContainer = document.createElement('div');
      exportContainer.style.display = 'none';
      document.body.appendChild(exportContainer);

      new QRCode(exportContainer, {
        text: content,
        width: 1024,
        height: 1024,
        colorDark: qrColor,
        colorLight: isTransparent ? "#ffffff" : bgColor,
        correctLevel: QRCode.CorrectLevel.H // 最高容錯率
      });

      setTimeout(() => {
        const qrCanvas = exportContainer.querySelector('canvas');
        if (!qrCanvas) {
          exportContainer.remove();
          return;
        }

        // 建立最終畫布處理透明背景或精美邊框
        const finalCanvas = document.createElement('canvas');
        const margin = 80;
        finalCanvas.width = qrCanvas.width + margin * 2;
        finalCanvas.height = qrCanvas.height + margin * 2;
        const ctx = finalCanvas.getContext('2d');

        if (!isTransparent) {
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
          ctx.drawImage(qrCanvas, margin, margin);
        } else {
          // 透明底色處理：將原本白色的底色像素剔除為完全透明
          const qrCtx = qrCanvas.getContext('2d');
          const imgData = qrCtx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            // 如果不是深色前景點，則設為完全透明
            if (data[i] > 200 && data[i+1] > 200 && data[i+2] > 200) {
              data[i + 3] = 0; // Alpha = 0
            }
          }
          qrCtx.putImageData(imgData, 0, 0);
          ctx.drawImage(qrCanvas, margin, margin);
        }

        // 觸發原生檔案下載
        const downloadLink = document.createElement('a');
        downloadLink.download = `Sakura_QR_${Date.now()}.png`;
        downloadLink.href = finalCanvas.toDataURL('image/png');
        downloadLink.click();

        // 清理暫存節點
        exportContainer.remove();
      }, 60);
    }

    exportPngBtn.addEventListener('click', downloadQRCodePNG);

    doneBtn.addEventListener('click', hideControlPanel);
    openPanelBtn.addEventListener('click', showControlPanel);

    urlInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => { generateQRAndModel(e.target.value.trim() || DEFAULT_URL, true); }, 280);
    });

    urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') hideControlPanel(); });
    btn2D.addEventListener('click', () => transitionTo('2D')); btn3D.addEventListener('click', () => transitionTo('3D'));
    floatBtn2D.addEventListener('click', () => transitionTo('2D')); floatBtn3D.addEventListener('click', () => transitionTo('3D'));

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      if (currentMode === '3D' && !isTransitioning) {
        const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
        const spherical = new THREE.Spherical().setFromVector3(offset);
        spherical.theta += delta * 0.12;
        const newOffset = new THREE.Vector3().setFromSpherical(spherical);
        camera.position.copy(controls.target).add(newOffset);
      }

      if (sparkleGeo && sparkleGeo.attributes.position) {
        const sArray = sparkleGeo.attributes.position.array;
        const blend = transitionBlend.value;
        for (let i = 0; i < SPARKLE_COUNT; i++) {
          const sp = sparkleData[i];
          const idx = i * 3;
          
          const currentAngle = sp.baseAngle + elapsedTime * (sp.speed * 0.15);
          const currentRad = sp.radius + Math.sin(elapsedTime * sp.floatFreq + sp.seed) * sp.floatAmp;
          
          const x2 = Math.cos(currentAngle) * currentRad;
          const y2 = 0;
          const z2 = Math.sin(currentAngle) * currentRad;

          const x3 = Math.cos(sp.baseAngle) * (sp.radius * 0.85);
          const y3 = sp.height3D + Math.sin(elapsedTime * sp.floatFreq + sp.seed) * (sp.floatAmp * 1.5);
          const z3 = Math.sin(sp.baseAngle) * (sp.radius * 0.85);

          sArray[idx] = x2 + (x3 - x2) * blend;
          sArray[idx + 1] = y2 + (y3 - y2) * blend;
          sArray[idx + 2] = z2 + (z3 - z2) * blend;
        }
        sparkleGeo.attributes.position.needsUpdate = true;
      }

      if (fallingPetals) {
        const pArray = fallingPetals.geometry.attributes.position.array;
        const vels = fallingPetals.userData.velocities;
        for (let i = 0; i < vels.length; i++) {
          pArray[i * 3] += vels[i].x + Math.sin(elapsedTime + i) * 0.015;
          pArray[i * 3 + 1] += vels[i].y;
          pArray[i * 3 + 2] += vels[i].z;
          if (pArray[i * 3 + 1] < -25) pArray[i * 3 + 1] = 45;
        }
        fallingPetals.geometry.attributes.position.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    initThree();

    generateQRAndModel(DEFAULT_URL, false, () => {
      const pArr = qrParticleGeo.attributes.position.array;
      const cArr = qrParticleGeo.attributes.color.array;
      for (let i = 0; i < MAX_QR_PARTICLES * 3; i++) {
        pArr[i] = pos3D[i]; cArr[i] = color3D[i];
      }
      qrParticleGeo.attributes.position.needsUpdate = true;
      qrParticleGeo.attributes.color.needsUpdate = true;
      
      currentMode = '3D';
      transitionBlend.value = 1;

      setTimeout(() => {
        transitionTo('2D');
      }, 600);
    });
  </script>
</body>
</html>
